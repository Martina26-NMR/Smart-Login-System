<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Login</title>
  <!-- font awsome -->
  <link href="css/all.min.css" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

      <body class="page page--dark">
        <div class="container my-5 text-center rounded">
          <div class="group m-auto w-75 p-5">
            <h2 class="login-card__title text-center mb-4 text-info">Sign Up</h2>
            <form id="signupForm">
              <input type="text" id="signupName" class="form-control mb-3" placeholder="Enter your name" />
              <input type="email" id="signupEmail" class="form-control mb-3" placeholder="Enter your email" />
              <input type="password" id="signupPassword" class="form-control mb-3" placeholder="Enter your password" />
              <button type="submit" class="btn btn-outline-info w-100">Sign Up</button>
            </form>
            <p id="message" class="text-danger mt-3"></p>
            <p id="alert" class="text-danger mt-3"></p>
            <p id="alert1" class="text-danger mt-3"></p>

            <p class="text-center text-white mt-3 fs-5">You have an account? </p>
            <a href="index.html" class="sign__up text-info">Sign In</a>
          </div>
        </div>

<script src="js/bootstrap.bundle.js"></script>
<script src="js/index.js"></script>
</body>
</html>
