<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Login</title>
  <!-- font awsome -->
  <link href="css/all.min.css" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
    <body class="page page--dark ">
        <div class="container my-5 text-center rounded">
            <div class="group m-auto w-75 p-5">
          <h2 class="login-card__title text-center mb-4 text-info">Smart Login System</h2>
          <form id="loginForm">
            <input type="email" id="loginEmail" class="form-control mb-3 login-card__input" placeholder="Enter your email" />
            <input type="password" id="loginPassword" class="form-control mb-3 login-card__input" placeholder="Enter your password" />
            <button type="submit" class="btn btn-outline-info w-100 login-card__btn">Login</button>
          </form>
          <p id="message" class="text-danger mt-3"></p>
      
          <p class="text-center text-white mt-3 login-card__footer fs-5" >
            Don't have an account? 
          </p>
          <a href="signIn.html" class="sign__up text-info">Sign Up</a>


        </div>
        </div>

<script src="js/bootstrap.bundle.js"></script>
<script src="js/index.js"></script>
</body>
</html>
